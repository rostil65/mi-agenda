<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#C2410C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mi Agenda">
<title>Mi Agenda Familia</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="styles.css">
</head>
<body class="out">
<header class="top">
  <div class="row" style="justify-content:space-between">
    <div class="row"><h1 id="titulo">Mi Agenda</h1><button id="reloj" class="reloj" data-a="irHoy" aria-label="Ir a hoy" hidden></button><span id="who" class="who"></span></div>
    <button id="syncBtn" class="sync" data-a="syncNow" aria-label="Sincronizar ahora"><span id="syncTxt">Sin conectar</span></button>
  </div>
  <div class="ramabar">
  <div class="seg ramas" role="group" aria-label="Ramas (se pueden encender las dos)">
    <button data-a="rama" data-v="personal" aria-pressed="false">Personal</button>
    <button data-a="rama" data-v="trabajo" aria-pressed="false">Trabajo</button>
  </div>
  <label class="search"><span class="sr">Buscar</span>
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 18a7 7 0 1 0 0-14 7 7 0 0 0 0 14zM21 21l-5-5"/></svg>
    <input id="q" type="search" placeholder="Buscar en mis cosas: citas, contactos, notas…" autocomplete="off">
  </label>
  </div>
</header>
<nav id="nav" class="nav" aria-label="Módulos"></nav>
<main id="main"></main>
<aside id="lateral" class="lateral" aria-label="Eventos y tareas"></aside>
<button id="fab" class="fab" data-a="nuevo" aria-label="Añadir">+</button>
<dialog id="dlg"><form id="frm" method="dialog"></form></dialog>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<input type="file" id="fileIn" hidden>
<script src="config.js"></script>
<script src="crypto.js"></script>
<script src="sync.js"></script>
<script src="app.js"></script>
</body>
</html>
